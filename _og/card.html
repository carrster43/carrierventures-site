<!doctype html>
<!-- Source for ../og-image.png (1200x630). Not served: GitHub Pages skips _ folders.
     Rebuild: see _og/README.md -->
<html lang="en"><head><meta charset="utf-8">
<style>
:root{--ink:#151a33;--soft:#3d4460;--muted:#6f6c63;--paper:#faf7f0;--card:#fff;--line:#e2dccd;--gold:#a87d1c;
--serif:Georgia,'Iowan Old Style',serif;--sans:'Helvetica Neue',Helvetica,Arial,sans-serif}
*{box-sizing:border-box;margin:0}
html,body{width:1200px;height:630px;background:var(--paper);overflow:hidden}
.card{position:absolute;inset:38px;background:var(--card);border:2px solid var(--line);border-radius:22px;padding:54px 60px 46px;display:flex;flex-direction:column}
.eyebrow{font:700 24px/1 var(--sans);letter-spacing:.16em;text-transform:uppercase;color:var(--gold)}
h1{font:700 74px/1.04 var(--serif);color:var(--ink);margin:22px 0 0;letter-spacing:-.5px}
.rows{display:grid;grid-template-columns:1fr 1fr;gap:28px;margin-top:34px}
.row{border-top:3px solid var(--gold);padding-top:16px}
.row b{display:block;font:700 19px/1 var(--sans);letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.row span{display:block;font:400 29px/1.25 var(--serif);color:var(--soft);margin-top:10px}
.foot{margin-top:auto;font:700 24px/1 var(--sans);color:var(--muted)}
</style></head>
<body><div class="card">
<div class="eyebrow">Carrier Ventures</div>
<h1>One family,<br>two workshops.</h1>
<div class="rows">
<div class="row"><b>Carrier Press LLC</b><span>Books: suspense, mystery, young readers, restored classics.</span></div>
<div class="row"><b>Carrier Labs LLC</b><span>Cast: books performed, a voice for each character.</span></div>
</div>
<div class="foot">carrierventures.org</div>
</div></body></html>
